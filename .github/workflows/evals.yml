name: evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 matters: it is the python3 that older Macs ship, where designers will run the scripts.
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Deterministic evals
        run: python evals/run_evals.py
      - name: Package builds
        run: python tools/package_skill.py
