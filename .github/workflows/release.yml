name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python evals/run_evals.py
      - run: python tools/package_skill.py
      - name: Publish release with the .skill file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v tag="${GITHUB_REF_NAME#v}" '$0 ~ "^## "tag {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/harness-atelier.skill --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
